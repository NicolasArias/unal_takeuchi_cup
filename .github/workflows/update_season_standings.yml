name: Update latest season standings

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-season-standings
  cancel-in-progress: false

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STANDINGS_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate standings
        env:
          ATCODER_COOKIE: ${{ secrets.ATCODER_COOKIE }}
        run: python scripts/generate_standings.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/src/data/seasons/
          if git diff --cached --quiet; then
            echo "No standings changes detected."
          else
            git commit -m "chore(standings): update latest season"
            git push
          fi
