name: Update latest season standings

on:
  schedule:
    # GitHub Actions cron uses UTC. These are 07:30, 08:00, 08:30, and 08:45 UTC-5.
    - cron: '30 12 * * 6,0'
    - cron: '0 13 * * 6,0'
    - cron: '30 13 * * 6,0'
    - cron: '45 13 * * 6,0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-season-standings
  cancel-in-progress: false

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find latest season
        id: season
        shell: bash
        run: |
          STAGE=$(python - <<'PY'
          from pathlib import Path
          import re

          stage_order = {"I": 1, "II": 2, "III": 3}
          candidates = []
          pattern = re.compile(r"(?P<year>\d{4})_(?P<stage>I|II|III)")

          for directory in Path("scripts").iterdir():
              match = pattern.fullmatch(directory.name)
              if directory.is_dir() and match and (directory / "data.json").is_file():
                  candidates.append((
                      int(match.group("year")),
                      stage_order[match.group("stage")],
                      directory.name,
                  ))

          if not candidates:
              raise SystemExit("No season folders matching YYYY_I, YYYY_II, or YYYY_III were found")

          print(max(candidates)[2])
          PY
          )
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Latest season: $STAGE"

      - name: Generate standings
        env:
          ATCODER_COOKIE: ${{ secrets.ATCODER_COOKIE }}
        run: python scripts/generate_standings.py "${{ steps.season.outputs.stage }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "front/src/data/seasons/Season_${{ steps.season.outputs.stage }}.json"
          if git diff --cached --quiet; then
            echo "No standings changes detected."
          else
            git commit -m "chore(standings): update ${{ steps.season.outputs.stage }}"
            git push
          fi
